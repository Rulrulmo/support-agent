# 로컬 환경. 실행: cp .env.example .env (LLM 키 입력) && docker compose up -d   (podman: podman compose up -d)
name: support-agent

services:
  postgres:
    image: pgvector/pgvector:pg17          # 벡터 검색. 키워드는 PostgreSQL 내장 전문 검색 (원본이 영어)
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${DB_PASSWORD:-support}
    ports: ["127.0.0.1:5432:5432"]        # 이 PC에서만
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      retries: 10

  # 모든 LLM 호출의 입구: 앱은 용도 이름(answer·judge·wiki·embed)만 알고, 벤더 키는 여기에만 둔다
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: [{ path: .env, required: false }]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}   # 비면 인증이 꺼진다 → 기본값을 항상 둔다
      DATABASE_URL: postgresql://support:${DB_PASSWORD:-support}@postgres:5432/litellm   # 호출별 비용 기록 (평가 비용 측정)
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
